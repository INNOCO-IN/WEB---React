<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1320, &quot;height&quot;: 460}}">class Component extends DCLogic {

  renderVals() {
    let __f = '';
    try { __f = decodeURIComponent(location.pathname.split('/').pop() || ''); } catch (e) {}
    let altHref = __f.replace('.KO.', '.EN.');
    if (altHref === __f || !__f) altHref = 'Home.EN.dc.html';
    const c = this.props.cta;
    const hasCta = c && c !== 'false' && c !== false;
    let loop = parseFloat(this.props.loop);
    if (isNaN(loop)) loop = 0.15;
    loop = Math.max(0, Math.min(1, loop));
    const L = Math.round(150 + loop * 1200);
    const ribbonPath = 'M0 60 L' + (L-70) + ' 60 C' + (L-34) + ' 60 ' + (L-24) + ' 53 ' + (L-19) + ' 53 C' + (L+11) + ' 44 ' + (L+17) + ' 22 ' + L + ' 21 C' + (L-17) + ' 20 ' + (L-19) + ' 41 ' + (L+3) + ' 50 C' + (L+10) + ' 55 ' + (L+34) + ' 60 ' + (L+70) + ' 60 L1500 60';
    const bandFill = hasCta ? String(c) : '#FAF4E2';
    let strokeColor = '#2E3B40';
    if (this.props.stroke) { return { altHref, bandFill, ribbonPath, strokeColor: String(this.props.stroke) }; }
    if (hasCta) {
      const hex = String(c).replace('#','');
      if (hex.length === 6) {
        const r = parseInt(hex.slice(0,2),16), g = parseInt(hex.slice(2,4),16), b = parseInt(hex.slice(4,6),16);
        const lum = (0.299*r + 0.587*g + 0.114*b);
        strokeColor = lum < 150 ? '#FAF4E2' : '#2E3B40';
      }
    }
    return { altHref, bandFill, ribbonPath, strokeColor };
  }
}</script>
