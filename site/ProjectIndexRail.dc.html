<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;500;600&amp;family=Archivo:wght@600;700;800&amp;display=swap" rel="stylesheet">
</helmet>
<div style="font-family: 'Newsreader', Georgia, serif;">
  <div style="font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(46,59,64,0.5); margin-bottom: 14px;">All projects</div>
  <div style="display: flex; flex-direction: column;">
    <sc-for list="{{ items }}" as="p" hint-placeholder-count="8">
      <a href="{{ p.href }}" style="{{ p.style }}">
        <span style="display:block; font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: #1E5A64; margin-bottom: 3px;">{{ p.meta }}</span>
        <span style="display:block; font-family: 'Newsreader', serif; font-weight: 600; font-size: 17px; line-height: 1.16; color: #1A1613;">{{ p.title }}</span>
      </a>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 300, &quot;height&quot;: 520}, &quot;current&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;food-revolution&quot;, &quot;tsType&quot;: &quot;string&quot;}}">
class Component extends DCLogic {
  data() {
    return [
      { slug: 'asia-exchange',      title: 'MEWE Asia Exchange',            meta: 'Flagship · 2026–27',        href: 'Project-Asia-Exchange.EN.dc.html' },
      { slug: 'food-revolution',    title: 'Food Revolution',                meta: 'Zayed University · 2017–22', href: 'Project-Food-Revolution.EN.dc.html' },
      { slug: 'uae-youth',          title: 'UAE Youth Social Innovation',    meta: 'Sharjah · 2017',            href: 'Project-UAE-Youth-Social-Innovation.EN.dc.html' },
      { slug: 'unc',                title: 'UAE-Nepal-Connect (UNC)',        meta: 'Kathmandu · 2016–18',       href: 'Project-UNC.EN.dc.html' },
      { slug: 'unc-documentary',    title: 'UNC Documentary',                meta: 'Nepal · 2017–18',           href: 'Project-UNC-Documentary.EN.dc.html' },
      { slug: 'light-shadow-shift', title: 'Light, Shadow, Shift',           meta: 'UAE · Women’s Retreat',     href: 'Project-Light-Shadow-Shift-Womens-Retreat.EN.dc.html' },
      { slug: 'jungle-jam',         title: 'Jungle Jam',                     meta: 'Dubai · 2022',              href: 'Project-Jungle-Jam.EN.dc.html' },
      { slug: 'shadow-shifter',     title: 'Shadow Shifter',                 meta: 'Taiwan · 2023',             href: 'Project-Shadow-Shifter.EN.dc.html' }
    ];
  }
  renderVals() {
    const current = this.props.current;
    const items = this.data().map(p => {
      const on = p.slug === current;
      return {
        title: p.title, meta: p.meta, href: p.href,
        style: 'display:block; text-decoration:none; cursor:pointer; background:' + (on ? 'rgba(30,90,100,0.12)' : 'transparent') + '; border-bottom:1px solid rgba(46,59,64,0.12); padding:13px 8px 13px 10px; ' + (on ? 'box-shadow: inset 3px 0 0 #1E5A64;' : '')
      };
    });
    return { items };
  }
}
</script>
</body>
</html>
