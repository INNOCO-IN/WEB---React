<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1320, &quot;height&quot;: 120}}">
class Component extends DCLogic {
  state = { hg: null, hd: null };

  onDotClick(e, gi, di) {
    const canHover = window.matchMedia && window.matchMedia('(hover: hover)').matches;
    if (!canHover && !(this.state.hg === gi && this.state.hd === di)) {
      e.preventDefault();
      this.setState({ hg: gi, hd: di });
    }
  }

  renderVals() {
    let f = '';
    try { f = decodeURIComponent(location.pathname.split('/').pop() || ''); } catch (e) {}
    let altHref = f.replace('.EN.', '.KO.');
    if (altHref === f || !f) altHref = 'Home.EN.dc.html';

    const GREY = 'rgba(46,59,64,0.55)';
    const DARK = '#2E3B40';
    const KW = "font-family:\'Archivo\', sans-serif; font-weight:700; font-size:13px; letter-spacing:0.14em; text-transform:uppercase; white-space:nowrap; transition:color 0.18s ease; ";
    const data = [[{"href":"Manifesto.EN.dc.html","color":"#1E8A86"},{"href":"Collectives.EN.dc.html","color":"#46325A"},{"href":"MEWE.EN.dc.html","color":"#1E648C"}],[{"href":"Workshop.EN.dc.html","color":"#E6328C"},{"href":"Story.EN.dc.html","color":"#FAB414"},{"href":"Protagonist.EN.dc.html","color":"#F05A28"}],[{"href":"Project.EN.dc.html","color":"#1E5A64"},{"href":"Community.EN.dc.html","color":"#D21E28"},{"href":"Constellation.EN.dc.html","color":"#F0D23C"},{"href":"News.EN.dc.html","color":"#966432"}]];
    const hovering = this.state.hg !== null;
    const out = { altHref, onLeave: () => this.setState({ hg: null, hd: null }) };

    data.forEach((dots, gi) => {
      const groupHovered = hovering && this.state.hg === gi;
      const o = { kwStyle: KW + 'color:' + (groupHovered ? DARK : GREY) + ';' };
      dots.forEach((d, di) => {
        const active = d.href === f;
        const lit = (groupHovered && this.state.hd === di) || (active && !hovering);
        o['d' + di] = 'width:10px; height:10px; border-radius:50%; flex:0 0 auto; transition:background 0.18s ease; background:' + (lit ? d.color : GREY) + ';';
        o['l' + di] = 'position:absolute; left:0; top:0; white-space:nowrap; transition:opacity 0.18s ease; color:' + DARK + '; opacity:' + (lit ? 1 : 0) + ';';
        o['e' + di] = () => this.setState({ hg: gi, hd: di });
        o['c' + di] = (e) => this.onDotClick(e, gi, di);
      });
      out['g' + (gi + 1)] = o;
    });
    return out;
  }
}
</script>
